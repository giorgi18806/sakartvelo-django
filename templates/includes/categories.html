  <!-- Categories Section Begin -->
    <section class="categories">
        <div class="container">
            <div class="row">
                <div class="categories__slider owl-carousel">
                  {% if categories %}
                  	{% for category in categories %}
                  		<div class="col-lg-3">
                        <div class="categories__item set-bg" data-setbg="static/img/categories/cat-{{ category.title }}.png">
                            <h5><a href="#">{{ category.title}}</a></h5>
                        </div>
                    </div>
                  	{% endfor %}
                  {% endif %}
                </div>
            </div>
        </div>
    </section>
    <!-- Categories Section End -->
