{% load static %}
<div class="product__item">
  <div class="product__item__pic set-bg" data-setbg="{% if product.image %}{% static product.image %}{% else %}{% static 'img/no-image.png' %}{% endif %}">
    <ul class="product__item__pic__hover">
      <li><a href="#"><i class="fa fa-heart"></i></a></li>
      <li><a href="#"><i class="fa fa-retweet"></i></a></li>
      <li><a href="#"><i class="fa fa-shopping-cart"></i></a></li>
    </ul>
  </div>
  <div class="product__item__text">
    <h6><a href="{% url 'sakartvelo:product-detail' product.pk %}">{{ product.title }}</a></h6>
    <h5>₴{{ product.price }}</h5>
  </div>
</div>
