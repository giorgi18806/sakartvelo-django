{% extends 'base.html' %}
{% block title %}
  <title>Sakartvelo | Login</title>
{% endblock %}

{% block content %}
  <h1>Log in</h1>

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit">Log in</button>
  </form>

  <p>
    Don't have an account?
    <a href="{% url 'sakartvelo:register' %}">Register</a>
  </p>
{% endblock %}
